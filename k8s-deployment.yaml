apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-api
  template:
    metadata:
      labels:
        app: ecommerce-api
    spec:
      containers:
      - name: ecommerce-api
        image: ecommerce-api:latest
        imagePullPolicy: Never # Jenkins ile lokalde üretilen imajı doğrudan kullanması için
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-api-service
spec:
  type: NodePort
  selector:
    app: ecommerce-api
  ports:
    - protocol: TCP
    - port: 80
      targetPort: 8080
      nodePort: 30080
      